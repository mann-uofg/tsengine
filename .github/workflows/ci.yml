name: ci

on:
  push:
  pull_request:

# The workflow only reads the repository; it needs no other access.
permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.cxx }} / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
        preset: [debug, release]
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  # Loads data produced by the real TSBS generator through the real TSBS InfluxDB loader,
  # then checks the contents, before and after a kill -9.
  tsbs-load:
    name: TSBS load
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build server
        run: |
          cmake --preset release
          cmake --build --preset release --target tsengine_server
      - name: Build TSBS
        run: |
          git clone https://github.com/timescale/tsbs.git /tmp/tsbs
          git -C /tmp/tsbs checkout -q 8323e59c74027b108f4ad5ec5d3e498b0101a02e
          mkdir -p /tmp/tsbs-bin
          cd /tmp/tsbs
          go build -o /tmp/tsbs-bin/ ./cmd/tsbs_generate_data ./cmd/tsbs_load_influx
      - name: Load and verify
        run: scripts/tsbs_smoke.sh build/release/tsengine_server /tmp/tsbs-bin

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: clang-format check
        run: git ls-files '*.h' '*.cpp' | xargs clang-format --dry-run --Werror
